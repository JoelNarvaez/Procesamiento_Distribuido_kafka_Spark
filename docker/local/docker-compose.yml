services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-local
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - proyecto_net

  spark-master:
    image: apache/spark:latest
    container_name: spark-master-local
    hostname: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080
    volumes:
      - ../../data:/opt/spark/data
      - ../../spark/jobs:/opt/spark/jobs
      - ../../spark/output:/opt/spark/output
    networks:
      - proyecto_net

  spark-worker:
    image: apache/spark:latest
    container_name: spark-worker-local
    hostname: spark-worker
    user: root
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
    volumes:
      - ../../data:/opt/spark/data
      - ../../spark/jobs:/opt/spark/jobs
      - ../../spark/output:/opt/spark/output
    networks:
      - proyecto_net

  mysql:
    image: mysql:8.0
    container_name: mysql-local
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: monitoreo_servidores
      MYSQL_USER: usuario
      MYSQL_PASSWORD: usuario123
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - proyecto_net

volumes:
  kafka_data:
  mysql_data:

networks:
  proyecto_net:
    driver: bridge